variables:
  GIT_STRATEGY: none

pages:
  stage: deploy
  script:
    - if (Test-Path repo_src) { Remove-Item -Recurse -Force repo_src }
    - if (Test-Path public) { Remove-Item -Recurse -Force public }
    
    - echo "=== 开始手动拉取代码 (使用 SSH) ==="
    # -c credential.helper= 是彻底禁用 Windows 弹窗的终极命令
    # git@gitgud.io... 是你之前测试成功的 SSH 路径
    - git -c credential.helper= clone git@gitgud.io:qrchen/emuera.em.doc.git repo_src
    
    - cd repo_src
    
    - echo "=== 开始安装依赖 ==="
    - pip install mkdocs mkdocs-material mkdocs-minify-plugin mkdocs-static-i18n mkdocs-material-extensions
    
    - echo "=== 开始构建网页 ==="
    - mkdocs build -d ../public

  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH