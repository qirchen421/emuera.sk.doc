# 禁用 Runner 内置的 Git 拉取，跳过卡死阶段
variables:
  GIT_STRATEGY: none

pages:
  stage: deploy
  script:
    # 强制关闭任何可能导致卡死的 Git 弹窗
    - $env:GIT_TERMINAL_PROMPT="0"
    - $env:GCM_INTERACTIVE="false"
    
    # 清理旧的文件夹（防止第二次运行报错）
    - if (Test-Path repo_src) { Remove-Item -Recurse -Force repo_src }
    - if (Test-Path public) { Remove-Item -Recurse -Force public }
    
    - echo "=== 开始手动拉取代码 ==="
    # 使用 GitLab 自动提供的临时 Token 进行克隆，绝对不会有权限问题
    - git clone "https://gitlab-ci-token:$env:CI_JOB_TOKEN@gitgud.io/qrchen/emuera.em.doc.git" repo_src
    
    # 进入代码目录
    - cd repo_src
    
    - echo "=== 开始安装依赖 ==="
    - pip install mkdocs mkdocs-material mkdocs-minify-plugin mkdocs-static-i18n mkdocs-material-extensions
    
    - echo "=== 开始构建网页 ==="
    # 将生成的网页输出到上一层目录的 public 文件夹中
    - mkdocs build -d ../public

  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH