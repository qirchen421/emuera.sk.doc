site_name: Emuera.EM+EE ドキュメント
repo_url: https://gitlab.com/EvilMask/emuera.em.doc
site_url: https://evilmask.gitlab.io/emuera.em.doc/
extra_javascript:
  - javascripts/highlight.min.js
  - javascripts/erabasic-highlighths.min.js
extra_css:
  - css/eraBasic.min.css
  - css/extra.css
theme:
  name: material
  highlightjs: false
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    #- navigation.expand
  palette:
    - scheme: slate
      primary: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
nav:
  - ホーム: README.md
  - リファレンス:
      - Reference/README.md
      - PRINT系:
          - Reference/PRINT.md
          - Reference/DRAWLINE.md
      - HTML系:
          - Reference/HTML_STRINGLEN.md
          - Reference/HTML_SUBSTRING.md
      - 表示操作・フォント操作・表示仕様参照:
          - Reference/SKIPLOG.md
          - Reference/GETDISPLAYLINE.md
      - 文字列操作・参照:
          - Reference/REGEXPMATCH.md
      - 変数操作・変数参照・CSV参照:
          - Reference/ISDEFINED.md
          - Reference/EXISTVAR.md
          - Reference/ENUMFUNC.md
          - Reference/ENUMVAR.md
          - Reference/ENUMMACRO.md
          - Reference/GETSETVAR.md
          - Reference/VARSETEX.md
          - Reference/ARRAYMSORTEX.md
          - Reference/ERDNAME.md
      - 入力・ウェイト:
          - Reference/INPUT.md
          - Reference/WAIT.md
          - Reference/INPUTANY.md
          - Reference/BINPUT.md
      - ループ・分岐構文:
          - Reference/IF.md
      - デバッグ補助・システムフロー制御:
          - Reference/QUIT.md
          - Reference/QUIT_AND_RESTART.md
          - Reference/FORCE_QUIT.md
          - Reference/FORCE_QUIT_AND_RESTART.md
          - Reference/FORCE_BEGIN.md
          - Reference/FLOWINPUT.md
      - ツールチップ系:
          - Reference/TOOLTIP_EXTENSION.md
      - 関数系（CALL等）:
          - Reference/CALL.md
          - Reference/JUMP.md
          - Reference/GOTO.md
          - Reference/RESTART.md
          - Reference/EXISTFUNCTION.md
          - Reference/TRYCALLF.md
          - Reference/TRYCALLFORMF.md
      - RETURN系 :
          - Reference/RETURN.md
      - AWAIT関連:
          - Reference/MOUSEB.md
      - 画像処理関連:
          - Reference/GDRAWTEXT.md
          - Reference/GGETFONT.md
          - Reference/GGETFONTSIZE.md
          - Reference/GGETFONTSTYLE.md
          - Reference/GGETTEXTSIZE.md
          - Reference/GDRAWGWITHROTATE.md
          - Reference/GGETPEN.md
          - Reference/GGETPENWIDTH.md
          - Reference/GGETBRUSH.md
          - Reference/SPRITEDISPOSEALL.md
          - Reference/GDRAWLINE.md
          - Reference/GDASHSTYLE.md
      - サウンド系:
          - Reference/PLAYSOUND.md
          - Reference/STOPSOUND.md
          - Reference/PLAYBGM.md
          - Reference/STOPBGM.md
          - Reference/EXISTSOUND.md
          - Reference/SETSOUNDVOLUME.md
          - Reference/SETBGMVOLUME.md
      - XML系:
          - Reference/XML_MANAGE.md
          - Reference/XML_GET.md
          - Reference/XML_SET.md
          - Reference/XML_TOSTR.md
          - Reference/XML_ADDNODE.md
          - Reference/XML_REMOVENODE.md
          - Reference/XML_REPLACE.md
          - Reference/XML_ADDATTRIBUTE.md
          - Reference/XML_REMOVEATTRIBUTE.md
      - MAP（連想配列）系:
          - Reference/MAP_MANAGE.md
          - Reference/MAP_OPERATION.md
          - Reference/MAP_GETKEYS.md
          - Reference/MAP_SERIALIZATION.md
      - DataTable（データベース）系:
          - Reference/DT_MANAGE.md
          - Reference/DT_COLUMN.md
          - Reference/DT_ROW.md
          - Reference/DT_CELL.md
          - Reference/DT_SELECT.md
          - Reference/DT_SERIALIZATION.md
      - その他:
          - Reference/EXISTFILE.md
          - Reference/ENUMFILES.md
          - Reference/UPDATECHECK.md
          - Reference/GETMEMORYUSAGE.md
          - Reference/CLEARMEMORY.md
          - Reference/TEXTBOX.md
  - 変更ログ: Changelog/README.md
  - i18n: i18n/README.md
plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
  - i18n:
      default_language: ja
      languages:
        ja:
          name: 日本語
          build: false
        en:
          name: English
          build: true
          site_name: Emuera.EM+EE Document
        zh:
          name: 简体中文
          build: true
          site_name: Emuera.EM+EE 帮助文档
      nav_translations:
        zh:
          ホーム: 首页
          リファレンス: 参考手册
          HTML系: HTML 系列
          文字列操作・参照: 字符串操作 / 引用
          変数操作・変数参照・CSV参照: 变量操作 / 变量引用 / CSV 引用
          デバッグ補助・システムフロー制御: 调试辅助 / 系统流程控制
          関数系（CALL等）: 函数系列（CALL 相关）
          画像処理関連: 图像处理相关
          サウンド系: 音频处理相关
          XML系: XML 文件处理相关
          ツールチップ系: 提示框处理相关
          MAP（連想配列）系: MAP（映射数组）相关
          その他: 其他
          変更ログ: 更新日志
          入力・ウェイト: 输入 / 等待
          DataTable（データベース）系: DataTable（数据库）相关
        en:
          ホーム: Home
          リファレンス: Reference
          変更ログ: Changelog

markdown_extensions:
  # Python Markdown
  - meta
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - admonition
  # Python Markdown Extensions
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.keys
