site_name: Emuera.EM+EE ドキュメント
repo_url: https://gitlab.com/EvilMask/emuera.em.doc
site_url: https://evilmask.gitlab.io/emuera.em.doc/
theme:
  name: material
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - content.code.annotate
  palette: 
    - scheme: slate 
      primary: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
nav:
  - ホーム: README.md
  - リファレンス:
    - Reference/README.md
    - HTML系:
      - Reference/HTML_STRINGLEN.md
      - Reference/REGEXPMATCH.md

  - 変更ログ: Changelog/README.md
plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
          remove_comments: true
  - i18n:
      default_language: ja
      languages:
        ja:
          name: 日本語
          build: true
        en:
          name: English
          build: true
          site_name: Emuera.EM+EE Document
        zh:
          name: 简体中文
          build: true
          site_name: Emuera.EM+EE 帮助文档
      nav_translations:
        zh:
          ホーム: 首页
          リファレンス: 参考手册
          変更ログ: 更新日志
        en:
          ホーム: Home
          リファレンス: Reference
          変更ログ: Changelog

markdown_extensions:
  # Python Markdown
  - meta
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - admonition
  # Python Markdown Extensions
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.keys